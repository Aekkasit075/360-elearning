<!-- Navigation -->
<div class="player-top-nav">

    <a href="course-detail.html" class="nav-link">
        <i class="fa-solid fa-chevron-left"></i>
        Back to Courses
    </a>

    <a href="#" class="nav-link" id="toggleSidebar">
        Browse Courses
        <i class="fa-solid fa-bars"></i>
    </a>

</div>

<!-- Video -->
<div class="video-player-wrapper">

    <img src="assets/images/courses/recommend1.png"
        class="video-element"
        alt="Course Video">

    <!-- Center Play -->
    <div class="center-play-btn">
        <i class="fa-solid fa-play"></i>
    </div>

    <!-- Controls -->
    <div class="video-controls">

        <div class="progress-area">

            <div class="progress-bar-bg">

                <div class="progress-fill"
                    style="width:52%;"></div>

            </div>

        </div>

        <div class="controls-row">

            <div class="controls-left">

                <i class="fa-solid fa-play control-icon"></i>

                <i class="fa-solid fa-forward-step control-icon"></i>

                <i class="fa-solid fa-volume-high control-icon"></i>

                <span class="time-display">
                    12:45 / 24:30
                </span>

            </div>

            <div class="controls-right">

                <span class="playback-speed">
                    1.0x
                </span>

                <i class="fa-solid fa-gear control-icon"></i>

                <i class="fa-solid fa-expand control-icon"></i>

            </div>

        </div>

    </div>

</div>
