<!-- Floating Action Buttons -->
<div class="floating-actions">

    <!-- Report Problem Button -->
    <button 
        class="report-problem-btn"
        data-bs-toggle="modal"
        data-bs-target="#reportProblemModal"
    >
        <i class="fa-solid fa-circle-exclamation"></i>
        Report Problem
    </button>


    <!-- Back To Top Button -->
    <button 
        class="back-to-top-btn"
        id="backToTop"
    >
        <i class="fa-solid fa-arrow-up"></i>
        <span>TOP</span>
    </button>

</div>


<!-- Report Problem Modal -->
<div 
    class="modal fade"
    id="reportProblemModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content report-modal">

            <!-- Modal Header -->
            <div class="modal-header report-header">
                <h5 class="modal-title">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    Report a problem
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>


            <!-- Modal Form -->
            <form id="reportForm" enctype="multipart/form-data">

                <!-- Modal Body -->
                <div class="modal-body">

                    <div class="row g-4">

                        <!-- First Name -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Name"
                                required
                            >
                        </div>


                        <!-- Last Name -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Last name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Last name"
                                required
                            >
                        </div>


                        <!-- Phone -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Phone number
                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                placeholder="Phone number"
                            >
                        </div>


                        <!-- Email -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                placeholder="email"
                                required
                            >
                        </div>


                        <!-- Problem Type -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Problem type
                            </label>

                            <select class="form-select">
                                <option selected>
                                    Select Problem
                                </option>

                                <option>
                                    Login
                                </option>

                                <option>
                                    Payment
                                </option>

                                <option>
                                    Course
                                </option>

                                <option>
                                    Website
                                </option>

                                <option>
                                    Other
                                </option>
                            </select>
                        </div>


                        <!-- Course -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Course
                            </label>

                            <select class="form-select">
                                <option selected>
                                    No course specified
                                </option>

                                <option>
                                    Frontend Development
                                </option>

                                <option>
                                    Backend Development
                                </option>

                                <option>
                                    UX/UI Design
                                </option>
                            </select>
                        </div>


                        <!-- Message -->
                        <div class="col-12">
                            <label class="form-label">
                                The message
                            </label>

                            <textarea
                                rows="6"
                                class="form-control"
                                placeholder="Type your message in this box."
                                required
                            ></textarea>
                        </div>


                        <!-- Upload Image -->
                        <div class="col-12">
                            <label class="form-label">
                                Upload photo
                            </label>

                            <input
                                type="file"
                                class="form-control"
                                id="problemImage"
                                accept=".jpg,.jpeg,.png,.pdf"
                            >
                        </div>

                    </div>

                </div>


                <!-- Modal Footer -->
                <div class="modal-footer justify-content-center">

                    <button
                        class="btn-confirm"
                        type="submit"
                    >
                        Confirm
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>
