<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schedules | 360 E-learning</title>


    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">



    <!-- Bootstrap -->

    <link rel="stylesheet" href="assets/lib/bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">



    <!-- FullCalendar -->

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">



    <!-- CSS -->

    <link rel="stylesheet" href="assets/css/header.css">

    <link rel="stylesheet" href="assets/css/footer.css">

    <link rel="stylesheet" href="assets/css/index.css">

    <link rel="stylesheet" href="assets/css/schedules.css">

    <link rel="stylesheet" href="assets/css/report-problem.css">


</head>


<body class="schedule-page">


    <div class="home-background">


        <header id="header"></header>



        <main>


            <section class="schedule-section">


                <div class="container">



                    <div class="schedule-header">


                        <div>

                            <h1>
                                Course Schedule
                            </h1>


                            <p>
                                Manage your learning schedule and keep track of every class.
                            </p>


                        </div>



                        <button class="btn btn-warning" id="addScheduleBtn" data-bs-toggle="modal"
                            data-bs-target="#scheduleModal">


                            <i class="fa-solid fa-plus"></i>

                            Add Schedule


                        </button>



                    </div>





                    <!-- Status -->

                    <div class="legend">


                        <span class="badge proceed">

                            <i class="fa-solid fa-circle"></i>

                            Proceed

                        </span>



                        <span class="badge pending">

                            <i class="fa-solid fa-circle"></i>

                            Pending

                        </span>



                        <span class="badge cancelled">

                            <i class="fa-solid fa-circle"></i>

                            Cancelled

                        </span>



                        <span class="badge complete">

                            <i class="fa-solid fa-circle"></i>

                            Complete

                        </span>


                    </div>







                    <!-- Calendar -->


                    <div class="calendar-card">


                        <div id="calendar"></div>


                    </div>



                </div>


            </section>


        </main>






        <!-- Modal -->


        <div class="modal fade schedule-modal" id="scheduleModal" tabindex="-1">


            <div class="modal-dialog modal-dialog-centered modal-lg">


                <div class="modal-content text-white">





                    <div class="modal-header border-secondary">


                        <h5 class="modal-title" id="modalTitle">

                            Add Course Schedule

                        </h5>



                        <button class="btn-close btn-close-white" data-bs-dismiss="modal">

                        </button>



                    </div>







                    <div class="modal-body">



                        <input type="hidden" id="eventId">






                        <div class="row">


                            <div class="col-md-6 mb-3">


                                <label class="form-label">

                                    Date

                                </label>



                                <input type="date" id="scheduleDate" class="form-control">


                            </div>





                            <div class="col-md-6 mb-3">


                                <label class="form-label">

                                    Course

                                </label>



                                <input type="text" id="courseName" class="form-control"
                                    placeholder="Frontend Development">


                            </div>



                        </div>









                        <div class="row">



                            <div class="col-md-6 mb-3">


                                <label class="form-label">

                                    Start Time

                                </label>



                                <input type="time" id="startTime" class="form-control">


                            </div>






                            <div class="col-md-6 mb-3">


                                <label class="form-label">

                                    End Time

                                </label>



                                <input type="time" id="endTime" class="form-control">


                            </div>



                        </div>









                        <div class="mb-3">


                            <label class="form-label">

                                Status

                            </label>



                            <select id="scheduleStatus" class="form-select">



                                <option value="Proceed">

                                    Proceed

                                </option>



                                <option value="Pending">

                                    Pending

                                </option>



                                <option value="Cancelled">

                                    Cancelled

                                </option>



                                <option value="Complete">

                                    Complete

                                </option>



                            </select>


                        </div>









                        <div class="mb-3">


                            <label class="form-label">

                                Notes

                            </label>



                            <textarea id="scheduleNote" rows="5" class="form-control" placeholder="Enter your notes...">

</textarea>



                        </div>






                    </div>









                    <div class="modal-footer border-secondary">



                        <button class="btn btn-danger" id="cancelSchedule">


                            <i class="fa-solid fa-ban"></i>

                            Cancel Schedule


                        </button>







                        <button class="btn btn-outline-danger" id="deleteSchedule">


                            <i class="fa-solid fa-trash"></i>

                            Delete


                        </button>








                        <button class="btn btn-secondary" data-bs-dismiss="modal">


                            Close


                        </button>







                        <button class="btn btn-warning" id="saveSchedule">


                            <i class="fa-solid fa-save"></i>

                            Save


                        </button>





                    </div>








                </div>


            </div>


        </div>







        <footer id="footer"></footer>



    </div>





    <!-- Bootstrap JS -->

    <script src="assets/lib/bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>




    <!-- FullCalendar JS -->

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>




    <!-- Layout -->

    <script src="assets/js/layout.js"></script>




    <!-- Schedule -->

    <script src="assets/js/schedules.js"></script>

    <script src="assets/js/report-problem.js"></script>

    <script src="assets/js/scroll-animation.js"></script>

</body>

</html>
