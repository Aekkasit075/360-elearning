```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - 360 Academy</title>


    <!-- Bootstrap -->
    <link rel="stylesheet" href="assets/lib/bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">


    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- Forgot Password CSS -->
    <link rel="stylesheet" href="assets/css/forgot-password.css">

</head>


<body>


    <div class="forgot-page">


        <div class="forgot-card">


            <!-- =========================
                    CLOSE BUTTON
            ========================== -->

            <a href="login.html" class="close-btn" aria-label="Close">

                <i class="fa-solid fa-xmark"></i>

            </a>



            <!-- =========================
                    LEFT SIDE
            ========================== -->

            <div class="left-side">


                <img src="assets/images/logo/logo2.png" class="logo360" alt="360 Academy Logo">


                <img src="assets/images/logo/logo3.png" class="logoText" alt="360 Academy">


            </div>



            <!-- =========================
                    RIGHT SIDE
            ========================== -->

            <div class="right-side">


                <!-- =========================
                        FORGOT PASSWORD FORM
                ========================== -->

                <div id="forgotContent" class="forgot-content">


                    <h2>
                        Forget password
                    </h2>


                    <form id="forgotForm">


                        <!-- EMAIL -->

                        <label for="email">
                            Email
                        </label>


                        <div class="input-group mb-3">

                            <input type="email" id="email" class="form-control" placeholder="Email" required>

                        </div>



                        <!-- CONFIRM -->

                        <button type="submit" class="btn-confirm">

                            Confirm

                        </button>



                        <!-- SIGN IN -->

                        <div class="signin">

                            Already have an account?

                            <a href="login.html">
                                Sign in
                            </a>

                        </div>


                    </form>


                </div>



                <!-- =========================
                        CONFIRMATION
                ========================== -->

                <div id="confirmationContent" class="confirmation-content">


                    <h2>

                        The confirmation has been
                        sent to your email.

                    </h2>



                    <!-- PAPER PLANE -->

                    <div class="plane">

                        <i class="fa-solid fa-paper-plane"></i>

                    </div>



                    <!-- BACK TO LOGIN -->

                    <a href="login.html" class="btn-back">

                        Back

                    </a>



                    <!-- LOGIN -->

                    <div class="signin">

                        Already a member?

                        <a href="login.html">
                            Log in
                        </a>

                    </div>


                </div>


            </div>


        </div>


    </div>



    <script>

        const forgotForm =
            document.getElementById("forgotForm");


        const forgotContent =
            document.getElementById("forgotContent");


        const confirmationContent =
            document.getElementById("confirmationContent");


        /* =========================
                CONFIRM
        ========================== */

        forgotForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                /* ตรวจสอบ Email */

                if (email === "") {

                    return;

                }


                /* แสดง Confirmation */

                forgotContent.classList.add("hidden");

                confirmationContent.classList.add("show");

            }
        );

    </script>


</body>

</html>
```
